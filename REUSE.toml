# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Purpose: Configure REUSE: package metadata + default licensing annotation.
# Design.: REUSE Specification 3.2+ (https://reuse.software/spec/).
#------------------------------------------------------------------------------
version = 1

SPDX-PackageName = "dopi-pdda"
SPDX-PackageDownloadLocation = "NOASSERTION"
SPDX-License-Concluded = "AGPL-3.0-or-later"

# Default annotation:
# - Covers every repository file that does not carry its own REUSE info.
# - License texts live exactly once in LICENSES. Everywhere else
#   licensing is expressed as SPDX expressions.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Igor Zubiaurre <igor@zubiaurre.es>"
SPDX-License-Identifier = "AGPL-3.0-or-later"
