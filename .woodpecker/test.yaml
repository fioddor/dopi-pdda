# SPDX-License-Identifier: AGPL-3.0-or-later
# Purpose: CI pipeline — the plug-in test suite on push events.
# Design.: Woodpecker server+agent run as containers on ghostell
#          (docker backend), same as the platform. The image is the
#          platform's devcontainer image (deb-obs-devcontainer:ci).
#          The platform is a dependency: it is INSTALLED from a wheel,
#          never cloned. The wheel directory is a host directory the
#          agent mounts (volumes: docker backend); pip finds the
#          platform wheel through PIP_FIND_LINKS pointing at it and
#          the plug-in's pyproject pins the version range. Then the
#          plug-in editable with its dev extras. `pytest` reads
#          `pytest.ini`: coverage and its threshold are enforced by
#          the suite config, not here. No branch/event filter by
#          design — every branch tip must be buildable.
# Authors: Igor Zubiaurre <igor@zubiaurre.es>
#-----------------------------------------------------------------------------

steps:
  - name: test
    image: deb-obs-devcontainer:ci
    environment:
      PIP_FIND_LINKS: /wheels
    volumes:
      - /srv/debian-observer.d/wheels:/wheels:ro
    commands:
      - pip install --user -q "debian-observer>=0.1.0,<0.2"
      - pip install --user -q -e ".[dev]"
      - pytest tests/ -q