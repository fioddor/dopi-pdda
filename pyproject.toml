[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dopi-pdda"
version = "0.1.0"
description = "Packages Deploy-Dependency Analysis: a Debian Observer plug-in."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Debian Observatory Team"},
]
keywords = ["debian", "observatory", "plugin", "dependency-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # The plug-in consumes the platform as a library: same version range
    # (lockstep with the platform until the plugin contract stabilises).
    "debian-observer>=1.0.0rc1,<1.1",
    "click",
    "pyarrow>=16.0",
    "duckdb>=0.10",
]

[project.optional-dependencies]
dev = [
    # pytest<9 until pytest-bdd supports pytest 9 (pytest-bdd 9.0 breaks on
    # pytest 9: FixtureManager lost _arg2fixturedefs — the BDD reliability
    # scenarios do not even collect). Revisit when a pytest-bdd release
    # declares pytest 9 support.
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23",
    "pytest-bdd>=7.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "reuse[charset-normalizer]>=4.0",
]

[project.scripts]
packages-deploy-deps-net-direct = "dopi_pdda.packages_deploy_deps_net_direct:main"
packages-deploy-deps-net-reverse = "dopi_pdda.packages_deploy_deps_net_reverse:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dopi_pdda"]

# The documentation is product: the user guide travels in the wheel.
[tool.hatch.build.targets.wheel.force-include]
"docs" = "dopi_pdda/docs"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]